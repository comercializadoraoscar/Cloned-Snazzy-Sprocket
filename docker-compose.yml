services:
  db:
    image: mysql:8.0
    container_name: cloned_snazzy_db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: snazzy_db
      MYSQL_USER: oscar_dev
      MYSQL_PASSWORD: dev_password
    volumes:
      - cloned_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    build: .
    container_name: cloned_snazzy_wp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: oscar_dev
      WORDPRESS_DB_PASSWORD: dev_password
      WORDPRESS_DB_NAME: snazzy_db
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./src:/var/www/html
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  cloned_db_data:
